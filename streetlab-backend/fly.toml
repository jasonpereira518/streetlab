# One machine, scaled to zero when idle: the simulation is a single shared world
# per process, so never scale this above 1. The browser's WebSocket (or any HTTP
# request) wakes it; "suspend" snapshots RAM so the world survives idle periods.
# Fly keeps it running while a WebSocket is open.
app = "streetlab-sim"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Browser origins allowed to open the WebSocket. Set the real value with
  # `fly secrets set STREETLAB_ALLOWED_ORIGINS=https://<your-vercel-domain>`.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

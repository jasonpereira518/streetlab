# One machine, scaled to zero when idle (kept from #34). Each WebSocket connection
# gets its own private simulation (STREETLAB_MAX_SESSIONS caps how many at once),
# so visitors do not share a world. Never scale this above 1 machine: sessions
# live in one process's memory, and a second machine would not know about the
# first one's cap. Fly keeps the machine running while a WebSocket is open;
# "suspend" only happens once every session has closed, so no live session is
# dropped. Cost of scale-to-zero: the first visitor after idle waits for the
# machine to resume. See docs/hosted-sessions.md.
app = "streetlab-sim"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  STREETLAB_MAX_SESSIONS = "2"
  # Browser origins allowed to open the WebSocket is NOT set here: it is a
  # deploy-time decision. Set it with
  # `fly secrets set STREETLAB_ALLOWED_ORIGINS=https://<your-vercel-domain>`
  # and read the startup log line "origin policy: ALLOWLIST" to confirm it took.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

# One always-on machine: the simulation is a single shared world per process,
# so never scale this above 1 and never let it auto-stop (state would reset).
app = "streetlab-sim"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  # Browser origins allowed to open the WebSocket. Set the real value with
  # `fly secrets set STREETLAB_ALLOWED_ORIGINS=https://<your-vercel-domain>`.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

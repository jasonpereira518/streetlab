# One always-on machine. Each WebSocket connection gets its own private
# simulation (STREETLAB_MAX_SESSIONS caps how many at once), so visitors do not
# share a world. Still never scale this above 1 machine: sessions live in one
# process's memory, and a second machine would not know about the first one's cap.
# Never let it auto-stop either: a stopped machine drops every live session.
# Capacity reasoning and the cost/size trade-off: docs/hosted-sessions.md.
app = "streetlab-sim"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  STREETLAB_MAX_SESSIONS = "2"
  # Browser origins allowed to open the WebSocket is NOT set here: it is a
  # deploy-time decision. Set it with
  # `fly secrets set STREETLAB_ALLOWED_ORIGINS=https://<your-vercel-domain>`
  # and read the startup log line "origin policy: ALLOWLIST" to confirm it took.

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"

[[vm]]
  size = "shared-cpu-2x"
  memory = "1gb"

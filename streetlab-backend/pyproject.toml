[project]
name = "streetlab-backend"
version = "0.1.0"
description = "StreetLab simulator backend — deterministic kinematic world, OSM scenes, reactive traffic"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13",
    "numpy>=2.0",
    "httpx>=0.27",
    "shapely>=2.0",
    "onnxruntime>=1.29",
    "pillow>=10.0",
]

[project.scripts]
streetlab = "server.cli:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.0",
    # Transitive via pyinstaller, but declared explicitly and pinned: the
    # packaged build's onnxruntime support depends on its hook-onnxruntime.py
    # (collect_dynamic_libs), so a future `uv lock --upgrade` moving this
    # silently is exactly the failure mode that must show up as a diff line
    # instead. Re-run the packaged-sidecar bound-provider check (`--perception
    # ml` against a local model path, confirm "detector session bound to
    # <provider>" in the log) after bumping this.
    "pyinstaller-hooks-contrib==2026.6",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests", "../contract"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.setuptools]
packages = ["server", "sim", "map", "perception", "plan"]
py-modules = ["schema"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

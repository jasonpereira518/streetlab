[project]
name = "streetlab-backend"
version = "0.1.0"
description = "StreetLab simulator backend — Cycle 1 walking skeleton"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pydantic>=2.9",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13",
    "numpy>=2.0",
    "httpx>=0.27",
    "shapely>=2.0",
]

[project.scripts]
streetlab = "server.cli:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.0",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
testpaths = ["tests", "../contract"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.setuptools]
packages = ["server", "sim", "map", "perception", "plan"]
py-modules = ["schema"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

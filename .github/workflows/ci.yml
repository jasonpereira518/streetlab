name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: streetlab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: streetlab/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: streetlab-backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: streetlab-backend/uv.lock
      - run: uv sync --frozen
      - run: uv run pytest -q tests ../contract

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # location.spec.ts's happy path needs live Nominatim/Overpass; it skips
      # itself when this is set, keeping CI deterministic.
      STREETLAB_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: streetlab/package-lock.json
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: streetlab-backend/uv.lock
      - name: Install backend (three e2e specs spawn it)
        run: uv sync --frozen
        working-directory: streetlab-backend
      - name: Install frontend
        run: npm ci
        working-directory: streetlab
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: streetlab
      - name: Run Playwright
        run: npm run test:e2e
        working-directory: streetlab
      - name: Keep traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: streetlab/test-results

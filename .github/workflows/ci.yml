name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: streetlab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: streetlab/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: streetlab-backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: streetlab-backend/uv.lock
      - run: uv sync --frozen
      # The contract tests take under a second; running them first surfaces a
      # wire-contract break in about a minute instead of after the full suite.
      - name: Contract tests
        run: uv run pytest -q ../contract
      # Whole-scenario replays are marked `slow` (tests/conftest.py SLOW_FILES).
      # The full suite did not finish inside 30 minutes on a hosted runner (it
      # was cancelled at 35%), so a pull request runs the rest and the slow set
      # has its own job below.
      - name: Backend tests (fast)
        run: uv run pytest -q -m "not slow" --durations=15 tests

  backend-slow:
    # Not on pull requests: main, the nightly schedule and manual runs.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        working-directory: streetlab-backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: streetlab-backend/uv.lock
      - run: uv sync --frozen
      - name: Backend tests (slow replays)
        run: uv run pytest -q -m slow tests

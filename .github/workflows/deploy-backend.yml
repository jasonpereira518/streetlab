# Redeploy the hosted backend (Cloud Run `streetlab-sim`) whenever backend code
# lands on main. Vercel redeploys the page from main on its own; without this
# the simulator lagged behind and the hosted page showed "Version mismatch" after
# every protocol bump. Auth is keyless (Workload Identity Federation): only
# workflows from this repository may act as the `github-deployer` service account.
name: Deploy backend

on:
  push:
    branches: [main]
    paths: ['streetlab-backend/**']
  workflow_dispatch:

# One deploy at a time; a newer push waits rather than racing the older one.
concurrency:
  group: deploy-backend
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/983029720774/locations/global/workloadIdentityPools/github/providers/streetlab
          service_account: github-deployer@streetlab-511905.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy to Cloud Run
        working-directory: streetlab-backend
        env:
          PROJECT_ID: streetlab-511905
          ALLOWED_ORIGINS: https://streetlab.jasonpereira.live,https://streetlab-omega.vercel.app
        run: ./deploy-cloudrun.sh

      - uses: astral-sh/setup-uv@v5

      - name: Smoke test the hosted backend
        working-directory: streetlab-backend
        run: uv run python ../scripts/smoke_hosted.py --url wss://streetlab-sim-nhir27unrq-ue.a.run.app --origin https://streetlab.jasonpereira.live --timeout 90
